# Example clamd.conf for TCP socket access in Docker/Nomad

LogFile /var/log/clamav/clamd.log
LogFileMaxSize 2M
LogTime yes
LogVerbose yes
LogSyslog yes

# Path to the database
DatabaseDirectory /var/lib/clamav

# Use TCP socket on port 3310
TCPSocket 3310
TCPAddr 0.0.0.0
Foreground yes

# Allow connections from any IP (adjust if you want tighter security)
AllowSupplementaryGroups yes

# Scan options
ScanMail yes
ScanArchive yes
DetectPUA yes
ScanPE yes
ScanOLE2 yes
ScanPDF yes
ScanHTML yes
ScanHWP3 yes
ScanELF yes

# Max file size to scan (adjust as needed)
MaxScanSize 1000M
